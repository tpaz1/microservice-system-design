name: Secure CI Pipeline for converter Service

on:
  pull_request:
    branches:
      - main
permissions:
  actions: read # for detecting the Github Actions environment.
  id-token: write # for creating OIDC tokens for signing.
  packages: write # for uploading attestations.
  contents: read
  security-events: write

jobs:
  ci-converter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set IMAGE_NAME env var
        run: echo "IMAGE_NAME=tompazus.jfrog.io/tomp-docker-dev-local/converter:${{ github.run_number }}" >> $GITHUB_ENV
      
      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        id: setup-cli
        env:
          JF_URL: ${{ vars.JF_URL }}
          IMAGE_NAME: tompazus.jfrog.io/tomp-docker-dev-local/converter:${{ github.run_number }}
        with:
          oidc-provider-name: github-jfrog-cli
      
      - name: converterenticate Docker
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.JF_URL }}
          username: ${{ steps.setup-cli.outputs.oidc-user }}
          password: ${{ steps.setup-cli.outputs.oidc-token }}

      - name: Install Hadolint
        run: |
          curl -sSL https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64 -o /usr/local/bin/hadolint
          chmod +x /usr/local/bin/hadolint

      - name: Lint Dockerfile for Security Best Practices
        run: hadolint converter/Dockerfile
      
      - name: build Docker Image Before Scanning
        run: docker build -t $IMAGE_NAME ./converter
      - name: Run XRay Scan Locally
        run: jf docker scan $IMAGE_NAME --output json > xray-scan-results.json
      
      - name: Upload XRay Scan Results as an Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xray-scan-results
          path: xray-scan-results.json

      - name: Enable Docker BuildKit & Secure Buildx
        run: |
          export DOCKER_BUILDKIT=1
          docker buildx create --use

      - name: Build & Push Multi-Arch Secure Docker Image
        env:
          JFROG_CLI_BUILD_NAME: converter-build
          JFROG_CLI_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          jf docker buildx build --platform linux/amd64 \
            --tag $IMAGE_NAME \
            --file converter/Dockerfile \
            --metadata-file=build-metadata \
            --push \
            converter/
          cat build-metadata
      - name: Extract Digest using Buildx Imagetools
        run: |
          REF=$(docker buildx imagetools inspect $IMAGE_NAME --format '{{ (index .Manifest.Manifests 0).Digest }}')
          FULL_REF="${IMAGE_NAME%@*}@$REF"
          echo "$FULL_REF" > image.txt
          echo "✅ Final image reference:"
          cat image.txt
          jf rt build-docker-create tomp-docker-dev-local --image-file image.txt --build-name converter-build --build-number ${{ github.run_number }}
          jf rt build-collect-env converter-build ${{ github.run_number }}
          jf rt build-add-git converter-build ${{ github.run_number }}
          jf rt build-publish converter-build ${{ github.run_number }}
      - name: Install Cosign v2.5.3
        run: |
          COSIGN_VERSION="v2.5.3"
          curl -Lo cosign "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
          chmod +x cosign
          sudo mv cosign /usr/local/bin/cosign
          cosign version
      - name: Sign Docker Image with Cosign
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          cosign version
          echo "${{ secrets.COSIGN_PRIVATE_KEY }}" > cosign.key
          chmod 600 cosign.key  # Secure key permissions
          cosign sign --key cosign.key --upload=true $IMAGE_NAME -y

      # - name: Publish Build Info with JFrog CLI
      #   env:
      #     JFROG_CLI_BUILD_NAME: converter-build
      #     JFROG_CLI_BUILD_NUMBER: ${{ github.run_number }}
      #   run: |
      #     jf rt build-collect-env
      #     jf rt build-add-git
      #     jf rt build-publish
      #     digest=$(docker inspect --format='{{index .RepoDigests 0}}' $IMAGE_NAME | cut -d@ -f2)
      #     echo "$IMAGE_NAME@$digest" > image.txt
      #     jf rt build-docker-create tomp-docker-dev-local --image-file image.txt
      
      - name: Run XRay Vulnerability Scan and Attach to Build
        run: |
          jf rt build-scan converter-build ${{ github.run_number }}